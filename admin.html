<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Licencias · TiempoMDZ (administración)</title>
<style>
:root{--bg:#07182b;--card:#0e2a47;--ink:#f2f7fb;--dim:#9fb4c8;--acc:#35b6ff;--ok:#3ddc97;--bad:#ff4d5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:640px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}p.s{color:var(--dim);margin:0 0 14px;font-size:13px}
.c{background:var(--card);border:1px solid #1d4b78;border-radius:14px;padding:14px;margin:0 0 12px}
h2{font-size:14px;margin:0 0 8px;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
input,select{width:100%;min-height:44px;border-radius:10px;border:1px solid #2a5f94;background:#0a2038;color:#fff;padding:6px 10px;font-size:15px}
button{min-height:44px;border-radius:10px;border:1px solid var(--acc);background:#0b4775;color:#fff;font-weight:700;padding:0 14px;margin-top:10px;font-size:14px}
button.r{border-color:var(--bad);background:#5a1520}button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row>*{flex:1}
#msg{min-height:22px;font-size:13px;margin:6px 0}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12.5px}td,th{padding:6px 4px;border-bottom:1px solid #1d4b78;text-align:left}
code{background:#0a2038;padding:1px 5px;border-radius:5px}
</style></head><body>
<h1>🔑 Licencias TiempoMDZ</h1>
<p class="s">Panel privado. La clave de administración no se guarda en la página: solo en esta pestaña.</p>
<div class="c"><h2>Acceso</h2>
<label>Clave de administración (ADMIN_KEY)</label><input id="key" type="password" autocomplete="off">
<label>Servidor de licencias</label><input id="url" placeholder="https://tiempomdz-licencias.usuario.workers.dev"></div>
<div class="c"><h2>Dar o renovar licencia</h2>
<label>ID de instalación del cliente (te lo manda por WhatsApp)</label><input id="dev" placeholder="TMDZ-XXXXXXXXXXXX" autocapitalize="characters">
<div class="row"><div><label>Tipo</label><select id="tier"><option value="pro">Pro</option><option value="basic">Básica</option></select></div>
<div><label>Plan</label><select id="plan"><option value="M">Mensual (30 días)</option><option value="S">Semestral (182 días)</option><option value="A">Anual (365 días)</option></select></div></div>
<label>Nota (nombre del cliente, opcional)</label><input id="note" maxlength="80">
<button id="grant">✅ Activar licencia</button>
<div class="row"><button id="revoke" class="r">⛔ Quitar licencia</button><button id="reset">↺ Dar prueba otra vez</button></div></div>
<div id="msg"></div>
<div class="c"><h2>Licencias activas</h2><button id="list" style="margin-top:0">Actualizar lista</button><div id="out" style="margin-top:8px;overflow-x:auto"></div></div>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
$('url').value=sessionStorage.getItem('adm_url')||(window.CM_CFG&&CM_CFG.licUrl)||'';$('key').value=sessionStorage.getItem('adm_key')||'';
const say=(t,ok)=>{$('msg').textContent=t;$('msg').className=ok?'ok':'bad'};
async function call(path,body){
  const u=$('url').value.trim().replace(/\/+$/,''),k=$('key').value;if(!u||!k){say('Completá la clave y el servidor.');return null}
  sessionStorage.setItem('adm_url',u);sessionStorage.setItem('adm_key',k);
  try{const r=await fetch(u+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+k,'Content-Type':'text/plain'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok){say('✖ '+(j.error||r.status));return null}return j}
  catch(e){say('✖ No pude conectar con el servidor.');return null}
}
const dev=()=>$('dev').value.trim().toUpperCase();
const fmt=ms=>new Date(ms).toLocaleDateString('es-AR');
$('grant').onclick=async()=>{const j=await call('/admin/grant',{device:dev(),tier:$('tier').value,plan:$('plan').value,note:$('note').value});if(j){say('✔ '+(j.tier==='pro'?'Pro':'Básica')+' activa hasta el '+fmt(j.exp),true);list()}};
$('revoke').onclick=async()=>{if(!confirm('¿Quitar la licencia de '+dev()+'?'))return;const j=await call('/admin/revoke',{device:dev()});if(j){say('✔ Licencia quitada',true);list()}};
$('reset').onclick=async()=>{const j=await call('/admin/reset-trial',{device:dev()});if(j)say(j.existia?'✔ Prueba reiniciada: el cliente tiene 5 días otra vez':'No había prueba registrada para ese ID.',j.existia)};
async function list(){const j=await call('/admin/list');if(!j)return;const o=$('out');o.textContent='';
  if(!j.licenses.length){o.textContent='Sin licencias.';return}
  const t=document.createElement('table');t.innerHTML='<tr><th>ID</th><th>Tipo</th><th>Vence</th><th>Nota</th></tr>';
  j.licenses.forEach(l=>{const r=t.insertRow();[l.device,l.tier==='pro'?'Pro':'Básica',fmt(l.exp)+(l.exp<Date.now()?' (vencida)':''),l.note||''].forEach(v=>{r.insertCell().textContent=v});r.cells[0].style.cursor='pointer';r.cells[0].onclick=()=>{$('dev').value=l.device}});o.appendChild(t)}
$('list').onclick=list;
</script></body></html>
