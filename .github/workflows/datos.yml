name: Copiar datos oficiales (SMN, INPRES, METAR)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: datos
  cancel-in-progress: false
jobs:
  copiar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Descargar fuentes
        run: node scripts/fetch-data.mjs
      - name: Guardar si hubo cambios
        run: |
          git config user.name "tiempomdz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "datos: actualización automática"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
